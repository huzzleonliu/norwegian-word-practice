[package]
name = "norwegian-word-practice"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1"
gloo-net = "0.6"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "File", "FileList", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement", "Url", "Window"] }
