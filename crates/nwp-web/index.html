<!DOCTYPE html>
<html class="theme-dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Norwegian Word Practice</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/fontsource/css/iosevka@5.2.5/index.min.css"
    />
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <link data-trunk rel="tailwind-css" href="style/input.css" />
    <link data-trunk rel="copy-dir" href="data" />
    <link data-trunk rel="copy-dir" href="docs/help/assets" />
    <link data-trunk rel="copy-file" href="public/nft/collection.png" data-target-path="nft" />
    <link data-trunk rel="copy-file" href="public/nft/collection.json" data-target-path="nft" />
    <script data-trunk rel="copy-file" type="module" src="js/oaoa-mint.js"></script>
    <link data-trunk rel="rust" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("ui_theme");
          var root = document.documentElement;
          root.classList.remove("theme-dark", "theme-light");
          root.classList.add(theme === "light" ? "theme-light" : "theme-dark");
        } catch (_) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
</head>

</html>
