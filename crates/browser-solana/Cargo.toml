[package]
name = "browser-solana"
version = "0.1.0"
edition = "2024"
description = "Browser WASM helpers for Solana wallet connect, JS bridges, and Candy Machine RPC reads"
license = "MIT"
readme = "readme.md"
keywords = ["solana", "wasm", "wallet", "browser"]
categories = ["wasm", "web-programming"]

[dependencies]
base64 = "0.22"
gloo-net = "0.6"
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
