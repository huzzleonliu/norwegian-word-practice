[package]
name = "solana-leptos-component"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
gloo-net = "0.6"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Window"] }
